name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      - run: go vet ./...
      - run: go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          out="dist/tai-${GOOS}-${GOARCH}"
          mkdir -p "$out"
          go build -trimpath -ldflags="-s -w" -o "$out/tai" .
          cp README.md "$out/"
          (cd "$out" && sha256sum tai > SHA256SUMS)
          tar -czf "$out.tar.gz" -C dist "tai-${GOOS}-${GOARCH}"
          tar -tvzf "$out.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: tai-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/tai-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz
          if-no-files-found: error
